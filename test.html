<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>模拟淘宝商品详情页</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .product-img { width: 200px; height: 200px; margin: 10px; object-fit: cover; }
    </style>
</head>
<body>
    <h1>高仿淘宝商品详情页（本地测试）</h1>
    <p>这是一款非常棒的商品，请点击右下角的按钮提取图片。</p>
    
    <!-- 模拟商品图片，使用了网络上的占位图 -->
    <img class="product-img" src="https://picsum.photos/id/1015/300/300" alt="商品图1">
    <img class="product-img" src="https://picsum.photos/id/1025/300/300" alt="商品图2">
    <img class="product-img" src="https://picsum.photos/id/1035/300/300" alt="商品图3">
    
    <!-- 模拟一个小图标（测试插件是否过滤） -->
    <img src="https://picsum.photos/50/50" width="50" height="50">

</html>
