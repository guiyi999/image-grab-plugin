<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图提取 - 电商图片批量下载插件</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">图提取 ImageGrab</div>
        <nav>
            <a href="#features">核心功能</a>
            <a href="#install">安装步骤</a>
        </nav>
    </header>
    <section class="hero">
        <h1>一键提取电商详情页所有图片</h1>
        <p>支持淘宝、京东、拼多多商家版，批量下载</p>
        <a href="#install" class="btn">立即安装</a>
    </section>
    <section id="features" class="features">
        <h2>核心功能</h2>
        <div class="grid">
            <div class="card"><h3>一键提取</h3><p>自动扫描页面所有商品图，兼容懒加载。</p></div>
            <div class="card"><h3>智能过滤</h3><p>自动排除小图标和占位图。</p></div>
            <div class="card"><h3>集中预览</h3><p>新页面网格展示所有图片。</p></div>
            <div class="card"><h3>批量下载</h3><p>勾选后一键保存到本地。</p></div>
        </div>
    </section>
    <section id="install" class="install">
        <h2>四步完成安装</h2>
        <ol>
            <li>下载插件压缩包并解压</li>
            <li>打开 Edge/Chrome，输入 <code>chrome://extensions/</code></li>
            <li>打开右上角「开发者模式」</li>
            <li>点击「加载已解压的扩展程序」</li>
        </ol>
    </section>
    <footer><p>© 2024 图提取 ImageGrab.</p></footer>
</body>
</html>
